name: Conductor CI/CD

on:
  push:
    branches: [ no_auth_cd_deployment ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   
  contents: read
jobs:
  # ========= CI: build & test =========
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      # ---- Backend: install + test ----
      - name: Install backend dependencies
        working-directory: app/backend
        run: npm install

      - name: Run backend lint
        working-directory: app/backend
        run: npm run lint

      - name: Run backend tests (Jest)
        working-directory: app/backend
        run: npm test

      - name: Generate backend docs (JSDoc)
        working-directory: app/backend
        run: npm run docs

      - name: Upload backend docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jsdoc
          path: app/backend/docs
          
      - name: Run Codacy code quality (backend only)
        if: github.ref != 'refs/heads/no_auth_cd_deployment'
        uses: codacy/codacy-analysis-cli-action@v4
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          directory: ${{ github.workspace }}/app/backend
          verbose: true

      # ---- Frontend: basic check ----
      - name: Check frontend files exist
        run: |
          test -f app/frontend/public/index.html
          ls app/frontend/src/pages

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm install

      - name: Run frontend lint
        working-directory: app/frontend
        run: npm run lint

      - name: Run Cypress
        working-directory: app/frontend
        run: npm run cy:run

  # ========= CD: create deployment artifact =========
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: conductor_env
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          output-credentials: true

      - name: Create deployment zip for Elastic Beanstalk
        run: |
          cd app
          zip -r ../conductor-eb.zip . \
            -x "backend/node_modules/*" \
            -x "frontend/node_modules/*" \
            -x "specs/*" \
            -x "document/*" \
            -x "*.pdf" \
            -x ".git/*" \
            -x ".DS_Store"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          region: ${{ secrets.AWS_REGION }}
          application_name: ${{ secrets.EB_APP_NAME }}
          environment_name: ${{ secrets.EB_ENV_NAME }}
          version_label: github-${{ github.run_number }}-${{ github.sha }}
          deployment_package: conductor-eb.zip