<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    <link rel="stylesheet" href="../../../assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/class-directory-nav.css">
    <script defer src="/assets/js/class-directory-nav.js"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/assets/css/i18n.css" />
    <title>Conductor App · Login</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    

    <main class="login_form">
        <form id="loginForm">
            <h3>Welcome to</h3>
            <div class="brand">
                <img src="../../../assets/logo/logo.png" alt="Conductor Tool Logo" class="logo-full">
            </div>

            <div style="height: 16px;"></div>
            <div class="input_box">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="name@conductor.edu" required />
            </div>
            <div class="input_box">
                <label for="classCode">Class Number</label>
                <input
                    type="text"
                    id="classCode"
                    name="classCode"
                    placeholder="CSE 210"
                    required
                />
                </div>


            <button type="submit">Login</button>

            <p class="separator"><span>or</span></p>
            <div class="login_option">
                <div class="option">
<a href="#" id="googleLoginButton" class="google-btn">
  <img src="/assets/logo/icons8-google.svg" alt="Google" />
  <span>Login with Google</span>
</a>
                </div>
            </div>

        </form>

        <div id="successMessage" class="success-message" aria-live="polite">
            <p>Taking you to your dashboard…</p>
        </div>

        <div id="loginError" class="error-message" aria-live="polite"></div>
    </main>
  

    <script src="script.js"></script>
</body>
</html>
