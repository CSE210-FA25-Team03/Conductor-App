<!DOCTYPE html>
<html lang="en" dir="auto">
<head>
    <link rel="stylesheet" href="/assets/css/class-directory-nav.css">
    <script defer src="/assets/js/class-directory-nav.js"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/assets/css/i18n.css" />
    <title>Conductor App · Login</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="login_form">
        <form id="loginForm">
            <h3>Welcome to Conductor</h3>

            <div style="height: 16px;"></div>

            <div class="login_option">
                <div class="option">
                    <a href="/auth/google/start">
                        <img src="/assets/logo/icons8-google.svg" alt="Google" /> Login with Google
                    </a>
                </div>
            </div>

        </form>

        <div id="successMessage" class="success-message" aria-live="polite">
            <p>Great! Taking you to your dashboard…</p>
        </div>

        <div id="loginError" class="error-message" aria-live="polite"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
