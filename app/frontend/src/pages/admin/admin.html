<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Conductor · Admin</title>
    <link rel="stylesheet" href="../login_page/style.css" />
    <!-- reuse login styles just to look decent -->
  </head>
  <body>
    <main class="login_form">
      <form id="adminForm">
        <h3>Admin · Create Class</h3>

        <div class="input_box">
          <label for="adminEmail">Admin Email</label>
          <input
            type="email"
            id="adminEmail"
            name="adminEmail"
            placeholder="admin@example.edu"
            required
          />
        </div>

        <hr style="margin: 16px 0" />

        <div class="input_box">
          <label for="classId">Class Number</label>
          <input
            type="text"
            id="classId"
            name="classId"
            placeholder="CSE 210"
            required
          />
        </div>
        <div class="input_box">
          <label for="profName">Professor Name</label>
          <input
            type="text"
            id="profName"
            name="profName"
            placeholder="Prof. Name"
            required
          />
        </div>
        <div class="input_box">
          <label for="profEmail">Professor Email</label>
          <input
            type="email"
            id="profEmail"
            name="profEmail"
            placeholder="prof@example.edu"
            required
          />
        </div>

        <button type="submit" class="login_button">Create / Update Class</button>

        <p id="adminStatus" style="margin-top: 12px; font-size: 0.9rem"></p>

        <div class="links" style="margin-top: 12px">
          <a href="../login_page/login.html">Go to Login</a>
        </div>
      </form>
    </main>

    <script src="../shared/storage.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
